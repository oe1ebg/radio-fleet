# Example data root (R13): every radio of SPEC.md with synthetic data (locator, regions,
# lists and snapshot). The owner's real fleet is in their private data repository.
# Frequencies in MHz.
#
# capability: what the radio can carry. TX limits are the Austrian amateur bands, so a
#   channel that transmits outside them is dropped. A zone or scan-list limit that is
#   left out is no limit. The channel, zone, scan-list and name limits follow the
#   manufacturers' data; the renderer step of each radio checks them against its tool.
# region: {locator, max_km} or {prefixes}; it applies to upstream channels only.
#   modes gives some modes another area; exclude names callsigns the radio never
#   gets, each with the reason that its drop shows.
# zones, scan_lists: zone (or bank) and scan-list rules. A rule's keys mode, band,
#   source, tag and channel (a name pattern) take one value or a list; a channel joins
#   when it meets every key. qdmr only: base_channel names hand-made channels of the
#   base that join first. qdmr and chirp write scan lists: CHIRP has one scan, so a
#   chirp radio with scan-list rules skips (Skip S) every channel that no rule takes.
#   A channel's own skip: true or false wins over the rules.
# step: chirp only, the tuning step (TStep) in kHz of a channel that sets none,
#   default 12.5. A channel off that step gets the coarsest CHIRP step it is on.
# base: the renderer's base file, relative to the data root; a base that is named but
#   missing is an error. jayt and Hytera base files never enter a repository; their
#   renderer steps say how they are given.
# dmrconf_radio: for the qdmr renderer, the radio key of `dmrconf verify --radio`
#   (`dmrconf --list-radios`). `fleet build` of a qdmr radio needs a base and a
#   dmrconf radio.
# own_lists: listen holds receive-only channels. qdmr and CHIRP write them so that
#   the radio cannot transmit; the other renderers drop them.
# dmr_template: the template of every upstream DMR repeater; dmr_templates names
#   other templates by callsign or callsign prefix (the longest one wins).
# power: the power of a channel that sets none, a level (Max, High, Mid, Low, Min) or
#   watts (5W, 0.5W). power_levels maps the levels to watts, or to the radio's own
#   values (LOW, LOW2, LOW3 or HIGH for jayt). Watts go to the nearest level that has
#   watts, the lower one on a tie, and the build reports it, such as "25W -> Max (5W)".
#   qdmr takes the levels as they are, Hytera maps them to High, Middle and Low, and
#   chirp writes watts. power_range {min, max, step} describes a radio that sets watts
#   in steps; no renderer writes it yet (the FTX-1 waits for jayt).
# naming: upstream is the name of an upstream channel, from {callsign}, {band} (the
#   capability band of its RX frequency) and {site} (the snapshot's name column);
#   replace rewrites every name.
# ft5d: zones become the ADMS banks 1 to 24, in order. MCP's FT5D output carries no
#   DCS, so a DCS channel fails the build; this example region excludes XX1CC.
# tools.jayt: the jayt executable (relative to the data root, or absolute) and the
#   commit it was built from; the jayt renderer needs it. The path here is a placeholder.
#   A jayt radio's base is its radio file (an FT-3185 image), which never enters a
#   repository: name a git-ignored or absolute path in the owner's fleet.yaml.
# tools.hytera: the export and import command lines of the Hytera tool, as argument
#   lists that run in the data root. {base}, {factory}, {document} and {output} stand
#   for the files; each command names exactly its own. The commands here are placeholders.
# hytera renderer: `base` is the radio's .rcdx (its secrets come from it) and `factory`
#   an unmodified CPS factory image (the defaults of added records). These files stay
#   outside every repository, so the Hytera profiles below show them as comments with
#   placeholder paths.
# equipment: the directory `fleet publish` copies a radio's build to, as
#   <equipment>/<equipment_dir>/generated/<date>/; relative to the data root, and it
#   must exist. A radio's equipment_dir is a directory inside it, default the radio id.
#   `fleet applied <radio>` records the build in applied.yaml in the data root. The
#   directory here is a placeholder that this repository does not have.

sources: [oevsv-repeater-db]
equipment: equipment

tools:
  jayt: {path: tools/jayt, commit: '0000000'}
  hytera:
    export: [tools/hytera-export, '{base}', '{document}']
    import: [tools/hytera-import, '{document}', '{output}', '{base}', '{factory}']

radios:
  d878uv2plus:
    model: AnyTone D878UV II Plus
    renderer: qdmr
    base: bases/qdmr/d878uv2plus.yaml
    dmrconf_radio: d878uv2
    equipment_dir: anytone/d878uv2plus
    capability: &anytone
      bands:
        - {name: 2m, rx: [136, 174], tx: [144, 146]}
        - {name: 70cm, rx: [400, 480], tx: [430, 440]}
      modes: [FM, DMR]
      channels: 4000
      zones: 250
      zone_channels: 250
      scan_lists: 250
      scan_list_channels: 50
      name_length: 16
    region:
      locator: JJ00mm
      max_km: 80
      modes: {DMR: {locator: JJ00mm, max_km: 150}}
    own_lists: [simplex, listen]
    dmr_template: standard
    zones: &dmr_zones
      - {name: Simplex, source: simplex}
      - {name: FM 2m, mode: FM, band: 2m}
      - {name: FM 70cm, mode: FM, band: 70cm}
      - {name: DMR, mode: DMR, base_channel: Hotspot}
    scan_lists: &dmr_scan_lists
      - {name: FM, mode: FM}
      - {name: DMR, mode: DMR, base_channel: Hotspot}
    power: High
    naming: {replace: {" TS1 ": " 1 ", " TS2 ": " 2 "}}

  d168uv:
    model: AnyTone D168UV
    renderer: qdmr
    base: bases/qdmr/d168uv.yaml
    dmrconf_radio: d168uv
    capability: *anytone
    region: {locator: JJ00mm, max_km: 50}
    own_lists: [simplex, listen]
    dmr_template: standard
    dmr_templates: {XX1BB: local}
    zones: *dmr_zones
    scan_lists: *dmr_scan_lists
    power: High
    naming: {replace: {" TS1 ": " 1 ", " TS2 ": " 2 "}}

  uv5r-mini:
    model: Baofeng UV-5R mini
    renderer: chirp
    capability: &baofeng
      bands:
        - {name: 2m, rx: [136, 174], tx: [144, 146]}
        - {name: 70cm, rx: [400, 520], tx: [430, 440]}
      modes: [FM]
      channels: 999
      name_length: 12
    region: {locator: JJ00mm, max_km: 40}
    own_lists: [simplex, listen]
    power: High
    power_levels: &baofeng_power {Max: 5W, High: 5W, Mid: 2W, Low: 1W, Min: 0.5W}

  uv9r-pro:
    model: Baofeng UV-9R Pro
    renderer: chirp
    capability: *baofeng
    region: {locator: JJ00mm, max_km: 40}
    own_lists: [simplex]
    scan_lists: [{name: Repeaters, source: oevsv-repeater-db}]
    step: 5
    power: High
    power_levels: *baofeng_power

  rt95:
    model: Retevis RT95
    renderer: chirp
    capability:
      bands:
        - {name: 2m, rx: [136, 174], tx: [144, 146]}
        - {name: 70cm, rx: [400, 480], tx: [430, 440]}
      modes: [FM]
      channels: 200
      name_length: 6
    region: {prefixes: [XX1, XX3]}
    own_lists: [simplex]
    power: High
    power_levels: {Max: 25W, High: 25W, Mid: 10W, Low: 5W, Min: 5W}

  ft5d:
    model: Yaesu FT5D
    renderer: ft5d
    capability:
      bands:
        - {name: 2m, rx: [108, 174], tx: [144, 146]}
        - {name: 70cm, rx: [400, 480], tx: [430, 440]}
      modes: [FM, C4FM]
      channels: 900
      zones: 24
      zone_channels: 100
      name_length: 16
    region:
      prefixes: [XX1, XX3, XX5]
      exclude: {XX1CC: "DCS, which MCP's FT5D output cannot carry"}
    own_lists: [simplex, listen]
    zones:
      - {name: Simplex, source: simplex}
      - {name: C4FM, mode: C4FM}
      - {name: FM 2m, mode: FM, band: 2m}
      - {name: FM 70cm, mode: FM, band: 70cm}

  ft3185:
    model: Yaesu FT-3185
    renderer: jayt
    capability:
      bands:
        - {name: 2m, rx: [136, 174], tx: [144, 146]}
        - {name: 70cm, rx: [400, 480], tx: [430, 440]}
      modes: [FM]
      channels: 200
      name_length: 6
    region: {locator: JJ00mm, max_km: 40}
    own_lists: [simplex]
    power_levels: {Max: HIGH, High: HIGH, Low: LOW}

  ftx1:
    model: Yaesu FTX-1
    renderer: jayt
    capability:
      bands:
        - {name: 10m, rx: [28, 29.7], tx: [28, 29.7]}
        - {name: 6m, rx: [50, 54], tx: [50, 52]}
        - {name: 2m, rx: [144, 148], tx: [144, 146]}
        - {name: 70cm, rx: [430, 450], tx: [430, 440]}
      modes: [FM, C4FM]
      channels: 900
      zones: 24
      zone_channels: 100
      name_length: 12
    region: {prefixes: [XX]}
    own_lists: [simplex]
    zones:
      - {name: Simplex, source: simplex}
      - {name: C4FM, mode: C4FM}
      - {name: FM, mode: FM}
    naming: {upstream: "{callsign} {band}"}

  hp785:
    model: Hytera HP785
    renderer: hytera
    # base: ../hytera/hp785.rcdx
    # factory: ../hytera/hp785-factory.rcdx
    capability: &hytera
      bands:
        - {name: 70cm, rx: [400, 470], tx: [430, 440]}
      modes: [FM, DMR]
      channels: 1024
      zones: 64
      zone_channels: 16
      name_length: 16
    region: {locator: JJ00mm, max_km: 40}
    own_lists: [simplex]
    dmr_template: standard
    zones:
      - {name: Simplex, source: simplex}
      - {name: DMR, mode: DMR}
      - {name: FM, mode: FM}
    power: High

  hm785:
    model: Hytera HM785
    renderer: hytera
    # base: ../hytera/hm785.rcdx
    # factory: ../hytera/hm785-factory.rcdx
    capability: *hytera
    region: {prefixes: [XX1, XX3]}
    own_lists: [simplex]
    dmr_template: standard
    zones:
      - {name: Simplex, source: simplex}
      - {name: DMR, mode: DMR}
      - {name: FM, mode: FM}
    power: High
