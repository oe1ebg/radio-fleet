# A profile's `dmr_template` turns each upstream DMR repeater into these channels, and its
# `dmr_templates` names other templates for some callsigns or callsign prefixes. The channel
# name is the upstream name followed by the entry's name, for example "XX1AA TS1 TG232".
templates:
  standard:
    - {name: TS1 TG232, time_slot: 1, tx_talkgroup: TG232, rx_group_list: Austria}
    - {name: TS2 TG9, time_slot: 2, tx_talkgroup: TG9}
  local:
    - {name: TS1 TG232, time_slot: 1, tx_talkgroup: TG232, rx_group_list: Austria}
    - {name: TS2 TG91, time_slot: 2, tx_talkgroup: TG91}
