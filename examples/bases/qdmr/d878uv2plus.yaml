# Synthetic qdmr base (R5). `fleet build` keeps everything here and adds the generated
# contacts, group lists, channels, zones and scan lists, whose ids start with gen_.
# !default (the radio's default) and !selected (the selected channel) are qdmr's own
# tags; the build keeps them.
version: 0.12.0
settings:
  defaultID: id1
  power: High
  tot: 0
radioIDs:
  - dmr: {id: id1, name: XX0SYN, number: 9990001}
contacts:
  - dmr: {id: cont1, name: Local 9, ring: false, type: GroupCall, number: 9}
  - dmr: {id: cont2, name: APRS Gateway, ring: false, type: PrivateCall, number: 9990999}
groupLists:
  - {id: grp1, name: Local, contacts: [cont1]}
channels:
  - dmr:
      id: ch1
      name: Hotspot
      rxFrequency: 433.6125 MHz
      txFrequency: 433.6125 MHz
      power: Low
      timeout: !default ""
      vox: !default ""
      colorCode: 1
      timeSlot: TS2
      groupList: grp1
      contact: cont1
      aprs: aprs1
positioning:
  - dmr: {id: aprs1, name: DMR APRS, period: 300 s, contact: cont2}
zones:
  - {id: zone1, name: Hotspot, A: [ch1]}
scanLists:
  - {id: scan1, name: Hotspot, primary: !selected "", channels: [ch1]}
