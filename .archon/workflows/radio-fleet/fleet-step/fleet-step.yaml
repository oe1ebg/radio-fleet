name: fleet-step
description: |
  Deliver one step of docs/PLAN.md as a reviewed pull request, using Archon's
  built-in delivery (archon-deliver: implement, draft PR, review, simplify, CI).
  A preflight checks the tools and that the step exists; merging stays with the owner.

  Use when: "deliver plan step N", "build the next radio-fleet step".
  NOT for: changing SPEC.md or the plan (the owner does that), or anything that
  talks to a radio.

inputs:
  step:
    required: true
    description: The step number in the table of docs/PLAN.md.
  note:
    default: ""
    description: Optional extra instructions from the owner for this step.

nodes:
  # Bash nodes read inputs as INPUTS_<NAME> env vars; $INPUTS.<name> works only in prompts.
  # stdout is the node's JSON output, so tool and check output goes to stderr.
  - id: preflight
    bash: |
      set -eu
      uv --version >&2
      just --version >&2
      git remote get-url origin >&2
      if ! grep -qE "^\| $INPUTS_STEP \|" docs/PLAN.md; then
        echo '{"ok": false}'
        exit 0
      fi
      just ci >&2
      echo '{"ok": true}'
    output_format:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

  - id: refuse
    depends_on: [preflight]
    when: "$preflight.output.ok == false"
    bash: |
      echo "step $INPUTS_STEP is not in docs/PLAN.md" >&2
      exit 1

  # Commits of this run are signed by the automation identity (ebirn-machine), not
  # the owner's key. The identity comes from FACTORY_SIGNING_CONFIG (~/.archon/.env),
  # the same identity.json Factory uses. It is set in this run's worktree only
  # (git config --worktree), never in the owner's checkout.
  - id: signer
    depends_on: [preflight]
    when: "$preflight.output.ok == true"
    bash: |
      set -eu
      : "${FACTORY_SIGNING_CONFIG:?FACTORY_SIGNING_CONFIG is not set (see ~/.archon/.env)}"
      field() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$FACTORY_SIGNING_CONFIG" "$1"; }
      if [ "$(git rev-parse --absolute-git-dir)" = "$(git rev-parse --path-format=absolute --git-common-dir)" ]; then
        echo "not in a run worktree: refusing to change the signing identity" >&2
        exit 1
      fi
      name=$(field name)
      email=$(field email)
      key=$(field private_key)
      allowed=$(field allowed_signers)
      python3 -c 'import os, stat, sys; sys.exit(stat.S_IMODE(os.stat(sys.argv[1]).st_mode) != 0o600)' "$key" \
        || { echo "automation key permissions are not 600" >&2; exit 1; }
      human=$(git config --global --get user.signingkey || true)
      case "$human" in
        "$key" | "$key.pub") echo "the automation key is the owner's signing key" >&2; exit 1 ;;
      esac
      git config extensions.worktreeConfig true
      git config --worktree user.name "$name"
      git config --worktree user.email "$email"
      git config --worktree gpg.format ssh
      git config --worktree gpg.ssh.program ssh-keygen
      git config --worktree gpg.ssh.allowedSignersFile "$allowed"
      git config --worktree user.signingkey "$key"
      git config --worktree commit.gpgsign true
      # Prove it: sign an unreferenced commit and check its signer.
      probe=$(git commit-tree -S -m "signing probe" "HEAD^{tree}")
      test "$(git log -1 --format=%G?/%GS "$probe")" = "G/$email" \
        || { echo "signing probe is not signed by $email" >&2; exit 1; }
      echo "commits are signed as $email" >&2

  - id: deliver
    include: archon-deliver
    depends_on: [signer]
    when: "$preflight.output.ok == true"
    with:
      work: |-
        Implement step $INPUTS.step of docs/PLAN.md in this repository (radio-fleet).

        Read AGENTS.md, SPEC.md and docs/PLAN.md first. The step's row in the plan
        names the requirements; implement exactly those, and meet each acceptance
        criterion in SPEC.md with a data-free test.

        Rules that hold for this work:
        - Never talk to a radio, never open a serial or USB port (G1).
        - Tests are offline and use synthetic data only; never add real codeplugs,
          radio images, Hytera files or secrets to the repository (G2).
        - External tools (dmrconf, jayt, hytera_reverse) go through an adapter with
          a fake for the tests; do not copy their code.
        - Do not change SPEC.md or docs/PLAN.md. If the step cannot be done as
          specified, stop and report why.
        - Checks: `just ci` must pass (ruff check, ruff format --check, mypy
          strict, pytest). Conventional Commits that name the requirement IDs.
        - A test that needs dmrconf carries `@pytest.mark.dmrconf`
          (tests/conftest.py skips it when dmrconf is missing). dmrconf 0.15 is
          installed on the machine that runs this workflow: run
          `just test-dmrconf` and put its result in the PR description. The CI
          job `dmrconf` runs these tests too.
        - Commits are signed by the automation identity, which this worktree's
          git config already sets. Commit normally. Do not change git config, do
          not pass signing or identity flags (`--no-gpg-sign`, `-c user.*`), and
          do not re-sign or rewrite commits.

        $INPUTS.note

  # Every commit the run added must carry the automation identity's signature.
  - id: verify-signer
    depends_on: [deliver]
    bash: |
      set -eu
      field() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$FACTORY_SIGNING_CONFIG" "$1"; }
      email=$(field email)
      allowed=$(field allowed_signers)
      git fetch -q origin main
      bad=0
      for c in $(git rev-list origin/main..HEAD); do
        got=$(git -c gpg.ssh.allowedSignersFile="$allowed" log -1 --format=%G?/%GS "$c")
        if [ "$got" != "G/$email" ]; then
          echo "not signed by $email: $(git log -1 --format='%h %s' "$c") ($got)" >&2
          bad=1
        fi
      done
      exit "$bad"
