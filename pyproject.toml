[project]
name = "radio-fleet"
version = "0.1.0"
description = "Build CPS files for every radio from one channel source (upstream repeater lists + own lists)"
authors = [
    { name = "Erich Birngruber", email = "ebirn@outdated.at" }
]
requires-python = ">=3.12"
dependencies = [
    "memory-channels-processor",
    "pyyaml>=6.0.4",
]

[project.scripts]
fleet = "radio_fleet.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
memory-channels-processor = { git = "https://gitlab.com/oe3lrt/memory-channels-processor.git", rev = "0.2.5" }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff==0.17.4",
    "types-pyyaml==6.0.12.20261103",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# memory-channels-processor ships no type information.
module = ["memory_channels_processor", "memory_channels_processor.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["dmrconf: needs the dmrconf CLI (qdmr 0.15); skipped when it is not installed"]
