name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Same commands as `just ci`.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q

  # Tests marked `dmrconf` against qdmr 0.15 (R5, R10). No Ubuntu LTS ships
  # qdmr 0.15 yet; Ubuntu 26.10 ships 0.15.1, so this job runs in that container.
  # Same commands as `just test-dmrconf`.
  dmrconf:
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    env:
      QT_QPA_PLATFORM: offscreen
      LANG: C.UTF-8
      FLEET_REQUIRE_DMRCONF: "1"
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qdmr git ca-certificates
          dmrconf --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      # Exit code 5 means no test is marked yet (before plan step 3).
      - run: uv run pytest -q -m dmrconf || test $? -eq 5
